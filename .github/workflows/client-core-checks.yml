name: Client and worker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client JavaScript syntax
        run: |
          set -e
          find public/js -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Worker JavaScript syntax
        run: |
          set -e
          find src -maxdepth 1 -type f -name 'demo-worker-v*.js' -print0 | xargs -0 -n1 node --check
      - name: Confirm active Worker exists
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');const m=s.match(/\"main\"\s*:\s*\"([^\"]+)\"/);if(!m||!fs.existsSync(m[1])){console.error('Active Worker missing');process.exit(1)};console.log('Active Worker:',m[1])"
      - name: Run v29 release contracts
        run: node --test tests/v29-release-contract.test.mjs
