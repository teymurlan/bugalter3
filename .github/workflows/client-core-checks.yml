name: Client and worker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client JavaScript syntax
        run: |
          set -e
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Worker JavaScript syntax
        run: |
          set -e
          find src -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Confirm active Worker exists
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8');const m=s.match(/\"main\"\s*:\s*\"([^\"]+)\"/);if(!m||!fs.existsSync(m[1])){console.error('Active Worker missing');process.exit(1)};console.log('Active Worker:',m[1])"
      - name: Run HOUSE CLEANING launch contracts
        run: node --test tests/v36-launch-contract.test.mjs
      - name: Run staff and admin contracts
        run: node --test tests/staff-admin-v1-contract.test.mjs
      - name: Run admin entry hardening contract
        run: node --test tests/admin-entry-hardening.test.mjs
      - name: Run client defect notification contract
        run: node --test tests/client-defect-rpc.test.mjs
      - name: Run central notification contract
        run: node --test tests/central-notifications.test.mjs
