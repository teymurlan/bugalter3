name: Playwright iPhone Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Запустить приложение
        run: |
          python3 -m http.server 4173 --directory public > /tmp/server.log 2>&1 &
          sleep 2

      - name: Проверить оформление уборки как на iPhone
        run: node tests/playwright-booking-v52.mjs

      - name: Сохранить скриншоты проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-playwright-check
          path: |
            playwright-*.png
          if-no-files-found: ignore
