name: Playwright iPhone Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установить Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Запустить приложение
        run: |
          python3 -m http.server 4173 --directory public > /tmp/server.log 2>&1 &
          sleep 2

      - name: Проверить как на iPhone
        run: |
          node --input-type=module <<'EOF'
          import { webkit, devices } from 'playwright';

          const browser = await webkit.launch();

          const iphone =
            devices['iPhone 15 Pro'] ||
            devices['iPhone 14 Pro'] || {
              viewport: { width: 393, height: 852 },
              isMobile: true,
              hasTouch: true
            };

          const context = await browser.newContext({
            ...iphone,
            locale: 'ru-RU'
          });

          const page = await context.newPage();

          await page.goto(
            'http://127.0.0.1:4173/?demo=1',
            { waitUntil: 'domcontentloaded' }
          );

          await page.waitForTimeout(1500);

          const title = await page.title();

          if (title !== 'HOUSE CLEANING') {
            throw new Error(
              `Неверный заголовок приложения: ${title}`
            );
          }

          const layout = await page.evaluate(() => ({
            screenWidth: document.documentElement.clientWidth,
            contentWidth: document.documentElement.scrollWidth
          }));

          if (layout.contentWidth > layout.screenWidth + 2) {
            throw new Error(
              `Интерфейс выходит за экран iPhone: ${layout.contentWidth}px > ${layout.screenWidth}px`
            );
          }

          await page.screenshot({
            path: 'iphone-check.png',
            fullPage: true
          });

          console.log('✅ HOUSE CLEANING открылся');
          console.log('✅ Проверка iPhone пройдена');
          console.log('✅ Элементы не выходят за экран');

          await browser.close();
          EOF

      - name: Сохранить скриншот проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-playwright-check
          path: iphone-check.png
          if-no-files-found: ignore
