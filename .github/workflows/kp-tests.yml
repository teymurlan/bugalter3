name: KP module checks

on:
  push:
    branches:
      - feature/kp-generator
      - hotfix/kp-assets-route-final2
      - feature/kp-mobile-ux
      - feature/kp-v5-polish
      - feature/kp-v6-wording-polish
  pull_request:
    paths:
      - 'src/kp-math.js'
      - 'src/demo-worker-v10.js'
      - 'src/demo-worker-v11.js'
      - 'public/kp/**'
      - 'tests/kp-math.test.mjs'
      - 'wrangler.jsonc'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/kp-math.js
          node --check src/demo-worker-v10.js
          node --check src/demo-worker-v11.js
          node --check public/kp/kp.js
          node --check public/kp/kp-ux-v4.js
          node --check public/kp/kp-ux-v5.js
          node --check public/kp/kp-ux-v6.js
          node --check public/kp/logo-data-v5.js
      - name: Calculation tests
        run: node tests/kp-math.test.mjs
