name: KP module checks

on:
  push:
    branches:
      - feature/kp-generator
      - hotfix/kp-assets-route-final2
      - feature/kp-mobile-ux
      - feature/kp-v5-polish
      - feature/kp-v6-wording-polish
      - feature/kp-v7-optional-customer-logo
      - hotfix/kp-v8-logo-spacing-footer
      - hotfix/kp-v11-numbering-pdf-share
      - feature/kp-commercial-v13
      - feature/kp-final-workflow-v16
      - feature/kp-first5-actual
      - feature/kp-step6-wording
      - feature/kp-steps7-9
      - feature/kp-flow-v2
  pull_request:
    paths:
      - 'src/kp-math.js'
      - 'src/demo-worker-v10.js'
      - 'src/demo-worker-v11.js'
      - 'src/demo-worker-v12.js'
      - 'src/demo-worker-v13.js'
      - 'src/demo-worker-v14.js'
      - 'src/demo-worker-v15.js'
      - 'src/demo-worker-v16.js'
      - 'src/demo-worker-v17-safe.js'
      - 'src/demo-worker-v18-client.js'
      - 'src/demo-worker-v19-kp-flow.js'
      - 'public/kp/**'
      - 'tests/kp-math.test.mjs'
      - 'tests/kp-flow-contract.test.mjs'
      - 'wrangler.jsonc'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/kp-math.js
          node --check src/demo-worker-v10.js
          node --check src/demo-worker-v11.js
          node --check src/demo-worker-v12.js
          node --check src/demo-worker-v13.js
          node --check src/demo-worker-v14.js
          node --check src/demo-worker-v15.js
          node --check src/demo-worker-v16.js
          node --check src/demo-worker-v17-safe.js
          node --check src/demo-worker-v18-client.js
          node --check src/demo-worker-v19-kp-flow.js
          node --check public/kp/kp.js
          node --check public/kp/kp-ux-v4.js
          node --check public/kp/kp-ux-v5.js
          node --check public/kp/kp-ux-v6.js
          node --check public/kp/kp-ux-v7.js
          node --check public/kp/kp-ux-v8.js
          node --check public/kp/kp-ux-v11.js
          node --check public/kp/kp-ux-v12.js
          node --check public/kp/kp-ux-v13.js
          node --check public/kp/kp-ux-v14.js
          node --check public/kp/kp-first5-v1.js
          node --check public/kp/kp-step6-v1.js
          node --check public/kp/kp-steps7-9-v1.js
          node --check public/kp/kp-flow-v2.js
          node --check public/kp/kp-flow-guard-v2.js
          node --check public/kp/logo-data-v5.js
          node --check tests/kp-flow-contract.test.mjs
      - name: Calculation tests
        run: node tests/kp-math.test.mjs
      - name: KP flow contract tests
        run: node tests/kp-flow-contract.test.mjs
