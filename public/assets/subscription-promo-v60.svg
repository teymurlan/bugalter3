    <circle cx="12" cy="-6" r="12" fill="url(#gold)"/><path d="m6-6 4 4 8-10" fill="none" stroke="#211707" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="1">5 или 10 уборок</text>
