  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0bd"/><stop offset=".48" stop-color="#ddb250"/><stop offset="1" stop-color="#9c6c14"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#e9c46c" stop-opacity=".32"/><stop offset="1" stop-color="#e9c46c" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000" flood-opacity=".38"/></filter>
</defs>

<rect width="960" height="720" rx="54" fill="url(#bg)"/>
<circle cx="780" cy="188" r="310" fill="url(#halo)"/>
<path d="M0 604C173 516 318 562 473 510c188-64 275-174 487-132v342H0Z" fill="#fff" opacity=".032"/>

<!-- premium home illustration -->
