<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>HOUSE CLEANING · КП</title>
  <style>
    html,body{margin:0;min-height:100%;background:#09090a;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  </style>
  <link rel="stylesheet" href="/kp/kp.css?v=2" />
  <link rel="stylesheet" href="/kp/kp-ux-v4.css?v=4" />
  <link rel="stylesheet" href="/kp/kp-ux-v5.css?v=5" />
  <link rel="stylesheet" href="/kp/kp-ux-v12.css?v=13" />
  <script src="/kp/tg-shim.js?v=2"></script>
  <script async src="https://telegram.org/js/telegram-web-app.js?63" onload="try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}"></script>
  <script defer src="/kp/logo-data.js?v=2"></script>
  <script defer src="/kp/logo-data-v5.js?v=5"></script>
  <script defer src="/kp/kp.js?v=2"></script>
  <script defer src="/kp/kp-ux-v4.js?v=4"></script>
  <script defer src="/kp/kp-ux-v5.js?v=5"></script>
  <script defer src="/kp/kp-ux-v6.js?v=6"></script>
  <script defer src="/kp/kp-ux-v7.js?v=7"></script>
  <script defer src="/kp/kp-ux-v8.js?v=11"></script>
  <script defer src="/kp/kp-ux-v11.js?v=11"></script>
  <script defer src="/kp/kp-ux-v12.js?v=13"></script>
</head>
<body>
  <div id="gate" class="gate boot-fallback">
    <div class="gate-card">
      <div class="hc-mark">HC</div>
      <h1>HOUSE CLEANING</h1>
      <p id="gateText">Проверяем доступ администратора…</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <div class="eyebrow">HOUSE CLEANING</div>
        <h1>Коммерческие предложения</h1>
      </div>
      <button id="newQuoteBtn" class="btn secondary">Новое КП</button>
    </header>

    <main class="layout">
      <section class="panel editor-panel">
        <div class="section-head">
          <div>
            <span class="step">01</span>
            <h2>Данные КП</h2>
          </div>
          <div id="quoteNumberBadge" class="number-badge">Исх. № —</div>
        </div>

        <div class="grid two">
          <label>Дата КП<input id="issueDate" type="date" /></label>
          <label>Срок действия, дней<input id="validDays" inputmode="numeric" type="number" min="1" max="90" value="14" /></label>
        </div>

        <div class="grid two">
          <label>Заказчик — необязательно<input id="clientName" placeholder="Можно оставить пустым" /></label>
          <label>Организация заказчика — необязательно<input id="clientCompany" placeholder="Можно оставить пустым" /></label>
        </div>

        <label>Адрес объекта<textarea id="address" rows="2" placeholder="Санкт-Петербург, адрес объекта"></textarea></label>

        <div class="grid two">
          <label>Тип объекта
            <select id="objectType">
              <option>Жилое помещение</option>
              <option>Квартира</option>
              <option>Загородный дом</option>
              <option>Офис</option>
              <option>Коммерческое помещение</option>
              <option>Другое</option>
            </select>
          </label>
          <label>Площадь объекта, м²<input id="area" inputmode="decimal" placeholder="203,5" /></label>
        </div>

        <label>Заголовок<input id="title" value="Коммерческое предложение на оказание клининговых услуг" /></label>

        <div class="section-head services-head">
          <div>
            <span class="step">02</span>
            <h2>Работы и расчёт</h2>
          </div>
          <button id="addItemBtn" class="btn ghost" type="button">+ Добавить услугу</button>
        </div>

        <div class="preset-row" id="presetRow"></div>
        <div id="items" class="items"></div>

        <div class="totals-card">
          <div><span>Подытог</span><strong id="subtotal">0 ₽</strong></div>
          <div class="discount-row"><span>Скидка, %</span><input id="discountPercent" class="mini-input" inputmode="decimal" value="0" /><strong id="discountValue">0 ₽</strong></div>
          <div class="grand"><span>ИТОГО</span><strong id="grandTotal">0 ₽</strong></div>
          <div><span>Предоплата, %</span><input id="prepaymentPercent" class="mini-input" inputmode="decimal" value="50" /><strong id="prepaymentValue">0 ₽</strong></div>
          <div><span>Остаток</span><strong id="balanceValue">0 ₽</strong></div>
        </div>

        <div class="section-head">
          <div>
            <span class="step">03</span>
            <h2>Условия</h2>
          </div>
        </div>

        <div class="grid two">
          <label>Срок выполнения<input id="duration" placeholder="1–2 дня" /></label>
          <label>НДС<input id="vatLabel" value="Без НДС" /></label>
        </div>
        <label>Условия оплаты<input id="paymentTerms" value="Предоплата 50%. Остаток — после выполнения работ." /></label>
        <label>Примечание<textarea id="notes" rows="3" placeholder="Необязательно"></textarea></label>

        <div class="sticky-actions">
          <button id="previewBtn" class="btn secondary" type="button">Предпросмотр</button>
          <button id="saveBtn" class="btn primary" type="button">Сохранить КП</button>
          <button id="pdfBtn" class="btn gold" type="button">Скачать PDF</button>
        </div>
      </section>

      <aside class="panel history-panel">
        <div class="section-head">
          <div>
            <span class="step">04</span>
            <h2>История КП</h2>
          </div>
          <button id="refreshHistoryBtn" class="icon-btn" title="Обновить">↻</button>
        </div>
        <div id="history" class="history"></div>
      </aside>
    </main>
  </div>

  <div id="previewModal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <div class="modal-head">
        <strong>Предпросмотр A4</strong>
        <button class="icon-btn" data-close-modal>×</button>
      </div>
      <div class="preview-scroll"><canvas id="previewCanvas"></canvas></div>
      <div class="modal-actions">
        <button id="modalPdfBtn" class="btn gold">Скачать PDF</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <noscript><div class="boot-fallback">Для генератора КП нужен JavaScript.</div></noscript>
</body>
</html>
